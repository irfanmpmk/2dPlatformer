<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2b2c;--btn:rgba(255,255,255,.13);--btnb:rgba(255,255,255,.4);--btnOn:rgba(255,255,255,.38);--fg:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1617}}
:root[data-theme="dark"]{--bg:#0d1617}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100%}
#touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
#touch button,#pauseBtn{pointer-events:auto;background:var(--btn);border:2px solid var(--btnb);color:#fff;
  font:9px 'Press Start 2P',monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button{width:64px;height:64px;border-radius:50%}
#touch button.on,#pauseBtn.on{background:var(--btnOn)}
.lp{display:flex;gap:14px}
.rp{display:grid;grid-template-columns:64px 64px;gap:10px}
#pauseBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:44px;height:32px;border-radius:8px}
@media (pointer:fine){#touch,#pauseBtn{display:none}}
</style>
</head>

<div id="wrap"><canvas id="c" width="480" height="270" aria-label="Blade of the Wilds game"></canvas></div>
<button id="pauseBtn" data-k="P" aria-label="Pause">II</button>
<div id="touch">
  <div class="lp"><button data-k="L" aria-label="Left">&#9664;</button><button data-k="R" aria-label="Right">&#9654;</button></div>
  <div class="rp"><button data-k="D">DASH</button><button data-k="S">WAVE</button><button data-k="A">SLASH</button><button data-k="J">JUMP</button></div>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=Math.random;
const rr=(a,b)=>a+rnd()*(b-a), ri=(a,b)=>Math.floor(rr(a,b+1)), pick=a=>a[Math.floor(rnd()*a.length)];
const R2=(a,b)=>a+Math.random()*(b-a);
function hh(a,b){let h=(a*374761393+b*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function shade(hex,a){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));
  return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1)}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hitCR(s,r){const cx=Math.max(r.x,Math.min(s.x,r.x+r.w)),cy=Math.max(r.y,Math.min(s.y,r.y+r.h));return(s.x-cx)**2+(s.y-cy)**2<s.r*s.r}

  ctx.fillStyle=sh||'#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c||'#fff';ctx.fillText(s,x,y)}

/* ---------- audio ---------- */
let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}
function snd(f,d,type,v,slide){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={jump:()=>snd(280,.12,'square',.035,320),slash:()=>snd(900,.08,'sawtooth',.025,-650),hit:()=>snd(170,.1,'square',.05,-90),

/* ---------- background layers ---------- */
function makeLayer(Ly,seed){
  const c=document.createElement('canvas');c.width=LW;c.height=H;const g=c.getContext('2d');const R=mulberry(seed);
  const rv=(a,b)=>a+R()*(b-a), s=Ly.s||1, n=Ly.n||8, col=Ly.c, hex=col[0]==='#';
  const lite=hex?shade(col,.12):col, dark=hex?shade(col,-.15):col;
  const wrap=fn=>{for(const o of[-LW,0,LW])fn(o)};
  const circ=(x,y,r)=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()};
  g.fillStyle=col;
  if(Ly.t==='hills'||Ly.t==='dunes'){
    const a1=rv(0,6),a2=rv(0,6),a3=rv(0,6);g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=LW;x+=4){const P2=Math.PI*2*x/LW;g.lineTo(x,Ly.y+Math.sin(P2*2+a1)*Ly.a*.6+Math.sin(P2*5+a2)*Ly.a*.3+(Ly.t==='hills'?Math.sin(P2*11+a3)*Ly.a*.12:0))}
    g.lineTo(LW,H);g.fill();
  }else if(Ly.t==='mountains'){
    const pk=[];let x=0;while(x<LW){const w=rv(110,220),h=rv(Ly.a*.55,Ly.a);pk.push([x+w/2,Ly.y-h,w]);x+=w*.55}
    wrap(o=>{for(const[px,py,w]of pk){g.fillStyle=col;g.beginPath();g.moveTo(px-w/2+o,H);g.lineTo(px+o,py);g.lineTo(px+w/2+o,H);g.fill();
      g.fillStyle=dark;g.beginPath();g.moveTo(px+o,py);g.lineTo(px+w/2+o,H);g.lineTo(px+w*.12+o,H);g.fill();
      if(Ly.snow){const sl=(H-py)/(w/2),d=22,hw=d/sl;g.fillStyle=Ly.snow;g.beginPath();g.moveTo(px+o-hw,py+d);g.lineTo(px+o,py);g.lineTo(px+o+hw,py+d);
        g.lineTo(px+o+hw*.4,py+d-5);g.lineTo(px+o,py+d+2);g.lineTo(px+o-hw*.4,py+d-4);g.fill()}}});
  }else if(Ly.t==='volcano'){
    wrap(o=>{for(const[cx,bw,top]of[[LW*.27,420,Ly.y],[LW*.74,300,Ly.y+40]]){g.fillStyle=col;g.beginPath();g.moveTo(cx-bw/2+o,H);g.lineTo(cx-20+o,top);g.lineTo(cx+20+o,top);g.lineTo(cx+bw/2+o,H);g.fill();

/* ---------- level ---------- */
let L=null,P=null,cam={x:0},score=0,time=0,state='title',sel=0,bannerT=0,overT=0,clearT=0,hitStop=0;
let shakeT=0,shakeA=0,shk={x:0,y:0};

function topAt(x,solids){let t=999;for(const b of solids)if(x>=b.x&&x<b.x+b.w&&b.y<t)t=b.y;return t}
function mkEnemy(type,x,gy,si){const d=EN[type],m=1+si*.12;
  const e={type,d,ai:d.ai,draw:d.draw,pal:d.pal,o:d.o||{},sc:1,x:x-d.w/2,y:gy-d.h,w:d.w,h:d.h,vx:0,vy:0,hp:Math.ceil(d.hp*m),sp:d.sp*(1+si*.04),
    face:-1,t:Math.random()*5,cd:R2(.5,2),flash:0,kb:0,atk:0,fly:d.ai==='fly',hitBy:-1,dmg:d.dmg,chT:0,sw:0};
  e.maxhp=e.hp;if(e.fly){e.y=gy-R2(60,100);e.hy=e.y}return e}
function genLevel(si){
  const S=STAGES[si];rnd=mulberry(si*7919+101);
  const solids=[],plats=[],ens=[],items=[];const len=3000+si*260;
  let x=-240,gy=200;solids.push({x:-240,y:gy,w:608,h:H});x=368;
  const segs=[];
  while(x<len){
    x+=ri(3,5)*16-8;
    gy=Math.max(160,Math.min(226,gy+pick([-24,-12,0,0,12,24])));
    const w=ri(14,30)*16;const b={x,y:gy,w,h:H};solids.push(b);segs.push(b);
    if(rnd()<.35&&w>=288){const sw=ri(5,8)*16;const sx=x+ri(4,Math.max(4,(w-sw)/16-2))*16;solids.push({x:sx,y:gy-ri(1,2)*16,w:sw,h:H})}
    if(rnd()<.6){const pw=ri(3,6)*16,px=Math.round(x+rnd()*(w-pw)),py=gy-ri(4,6)*16+8;const pl={x:px,y:py,w:pw,h:8};plats.push(pl);
      for(let k=0;k<pw/16;k++)items.push({type:rnd()<.07?'heart':'coin',x:px+4+k*16,y:py-16,w:8,h:8,st:1});
      if(rnd()<.35){const t=pick(S.enemies);if(EN[t].ai!=='fly')ens.push(mkEnemy(t,px+pw/2,py,si))}}
    x+=w;
  }
  for(const b of segs){const n=ri(1,2+Math.floor(si/3));for(let k=0;k<n;k++){const t=pick(S.enemies),ex=b.x+40+rnd()*(b.w-80);ens.push(mkEnemy(t,ex,topAt(ex,solids),si))}
    if(rnd()<.5){const cx=b.x+b.w/2;for(let k=0;k<5;k++){const ix=cx-36+k*16;items.push({type:'coin',x:ix,y:topAt(ix,solids)-18-Math.sin(k/4*Math.PI)*14,w:8,h:8,st:1})}}}
  x+=48;solids.push({x,y:200,w:1088,h:H});
  const layers=S.layers.map((ly,i)=>({c:makeLayer(ly,si*31+i*7+3),p:ly.p}));
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,S.sky[0]);sky.addColorStop(1,S.sky[1]);
  rnd=Math.random;
  return{si,S,solids,plats,enemies:ens,items,shots:[],parts:[],texts:[],arenaX:x+120,ay:200,lock:null,boss:null,started:false,portal:null,layers,sky,startScore:score};
}
function newPlayer(){return{x:20,y:150,w:12,h:22,vx:0,vy:0,face:1,onGround:false,jumps:0,coy:0,jb:0,atk:0,atkCd:0,swing:0,combo:0,hp:10,maxhp:10,en:40,
  inv:0,kb:0,dashT:0,dashCd:0,anim:0,safe:{x:20,y:150},dead:false}}
function loadStage(si){L=genLevel(si);L.startScore=score;P=newPlayer();cam.x=-40;state='play';bannerT=3;initWeather()}

/* ---------- physics ---------- */
function moveEnt(e,dt){
  e.hitWall=false;e.x+=e.vx*dt;
  for(const b of L.solids)if(ov(e,b)){if(e.vx>0)e.x=b.x-e.w;else if(e.vx<0)e.x=b.x+b.w;e.hitWall=true}
  if(L.lock!=null){if(e.x<L.lock){e.x=L.lock;e.hitWall=true}if(e.x+e.w>L.lock+W){e.x=L.lock+W-e.w;e.hitWall=true}}
  const pb=e.y+e.h;e.y+=e.vy*dt;e.onGround=false;
  for(const b of L.solids)if(ov(e,b)){if(e.vy>0){e.y=b.y-e.h;e.vy=0;e.onGround=true;e.ground=b}else if(e.vy<0){e.y=b.y+b.h;e.vy=0}}
  if(e.vy>=0)for(const b of L.plats)if(e.x+e.w>b.x&&e.x<b.x+b.w&&pb<=b.y+.5&&e.y+e.h>=b.y){e.y=b.y-e.h;e.vy=0;e.onGround=true;e.ground=b}
}
function solidAt(x,y){for(const b of L.solids)if(x>=b.x&&x<b.x+b.w&&y>=b.y)return true;return false}
function floorAt(x,y){if(solidAt(x,y))return true;for(const b of L.plats)if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+8)return true;return false}
function groundAhead(e){return floorAt(e.face>0?e.x+e.w+2:e.x-2,e.y+e.h+4)}

/* ---------- fx ---------- */
function shake(a,t){shakeA=Math.max(shakeA,a);shakeT=Math.max(shakeT,t||.2)}
function burst(x,y,cols,n,sp,g){for(let i=0;i<n&&L.parts.length<500;i++){const a=Math.random()*7,v=Math.random()*(sp||120);
  L.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(sp||120)*.3,l:R2(.3,.7),ml:.7,c:cols[i%cols.length],s:Math.random()<.5?2:3,g:g==null?400:g})}}
function popText(x,y,s,c){L.texts.push({x,y,s,c:c||'#fff',l:.8})}
function palCols(p){return Object.values(p).filter(v=>v[0]==='#').slice(0,4)}

/* ---------- player ---------- */
function hurtP(d,dir){if(P.inv>0||P.dead||P.dashT>0)return;P.hp-=d;P.inv=1.1;P.kb=.25;P.vx=dir*170;P.vy=-190;SFX.hurt();shake(4,.25);
  burst(P.x+6,P.y+10,['#ff4a4a','#fff'],10,100);popText(P.x+6,P.y-4,'-'+d,'#ff6a6a');if(P.hp<=0)die()}
function die(){P.dead=true;P.hp=0;burst(P.x+6,P.y+10,['#fff','#f3c99c','#7a4a2a','#ff4a4a'],30,180);SFX.boom();state='over';overT=0;
  if(score>best){best=score;store.set('botw_best',best)}}
function swordBox(){return{x:P.face>0?P.x+P.w-2:P.x-26,y:P.y+2,w:28,h:18}}
function updPlayer(dt){
  const p=P;p.anim+=dt;p.inv-=dt;p.atkCd-=dt;p.dashCd-=dt;
  const dir=(keys.R?1:0)-(keys.L?1:0);
  if(p.kb>0)p.kb-=dt;
  else if(p.dashT>0){p.dashT-=dt;p.vx=p.face*270;p.vy=0;if(Math.random()<.6)L.parts.push({x:p.x+6,y:p.y+R2(4,20),vx:-p.face*30,vy:0,l:.25,ml:.25,c:'#e6f6ff',s:2,g:0})}
  else{p.vx+=(dir*115-p.vx)*Math.min(1,dt*(p.onGround?16:8));if(dir)p.face=dir}
  if(pressed.J)p.jb=.13;else p.jb-=dt;
  if(p.onGround){p.coy=.1;p.jumps=0}else p.coy-=dt;
  if(p.jb>0&&p.kb<=0){if(p.coy>0){p.vy=-318;p.jumps=1;p.coy=0;p.jb=0;SFX.jump();burst(p.x+6,p.y+p.h,['#e8e0d0'],5,50,0)}
    else if(p.jumps<2){p.vy=-285;p.jumps=2;p.jb=0;SFX.jump();for(let i=0;i<8;i++){const a=i/8*7;L.parts.push({x:p.x+6,y:p.y+p.h,vx:Math.cos(a)*60,vy:Math.sin(a)*20,l:.3,ml:.3,c:'#ffffff',s:2,g:0})}}}
  if(!keys.J&&p.vy<-150&&p.kb<=0&&p.jumps>0)p.vy=-150;
  if(pressed.A&&p.atkCd<=0){p.atk=.22;p.atkCd=.27;p.swing++;p.combo=(p.combo+1)%3;SFX.slash()}
  if(pressed.S&&p.en>=25){p.en-=25;SFX.wave();L.shots.push({x:p.x+6+p.face*10,y:p.y+11,vx:p.face*260,vy:0,g:0,r:9,kind:'pwave',hostile:false,life:1.4,dmg:3,hits:new Set(),face:p.face})}
  if(pressed.D&&p.dashCd<=0&&p.kb<=0){p.dashT=.16;p.dashCd=.6;SFX.dash()}
  if(p.dashT<=0)p.vy=Math.min(p.vy+G*dt,430);
  moveEnt(p,dt);
  if(p.x<-230)p.x=-230;
  if(p.onGround&&p.ground&&L.solids.includes(p.ground)&&p.x>p.ground.x+10&&p.x+p.w<p.ground.x+p.ground.w-10)p.safe={x:p.x,y:p.y};
  if(p.y>H+30){const lava=L.S.gap==='lava';P.inv=0;p.hp-=lava?3:2;SFX.hurt();shake(4,.3);popText(p.safe.x,p.safe.y-10,lava?'-3':'-2','#ff6a6a');
    if(p.hp<=0){p.y=H;die();return}p.x=p.safe.x;p.y=p.safe.y-4;p.vx=0;p.vy=0;p.inv=1.2}
  if(p.atk>0){p.atk-=dt;
    if(p.atk>.08){const sb=swordBox(),dmg=p.combo===0?2:1;
      for(const e of L.enemies)if(!e.dead&&e.hitBy!==p.swing&&ov(sb,e)){e.hitBy=p.swing;hitEnemy(e,dmg,p.face)}
      const b=L.boss;if(b&&!b.dying&&b.state!=='intro'&&b.hitBy!==p.swing&&ov(sb,b)){b.hitBy=p.swing;hitEnemy(b,dmg,p.face)}
      for(const s of L.shots)if(s.hostile&&s.kind!=='shock'&&hitCR(s,sb)){s.life=0;burst(s.x,s.y,['#fff','#ffe08a'],6,90);SFX.hit()}}}
}

/* ---------- enemies ---------- */
function hitEnemy(e,d,dir){e.hp-=d;e.flash=.12;hitStop=.045;SFX.hit();shake(2,.1);P.en=Math.min(100,P.en+5);
  burst(e.x+e.w/2,e.y+e.h/2,['#fff','#ffe08a'],6,110);popText(e.x+e.w/2,e.y-6,''+d,'#ffe08a');
  if(!e.boss){e.kb=.16;e.vx=dir*130;if(!e.fly)e.vy=-110}
  if(e.hp<=0){if(e.boss)bossDie(e);else killEnemy(e)}}
function killEnemy(e){e.dead=true;burst(e.x+e.w/2,e.y+e.h/2,palCols(e.pal).concat(['#fff']),18,150);const pts=50*e.maxhp;score+=pts;popText(e.x+e.w/2,e.y-12,'+'+pts,'#9fe8ff');
  if(Math.random()<.14)L.items.push({type:'heart',x:e.x+e.w/2-4,y:e.y,w:8,h:8,vx:0,vy:-150});
  else{const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)L.items.push({type:'coin',x:e.x+e.w/2-4,y:e.y,w:8,h:8,vx:R2(-60,60),vy:R2(-220,-120)})}}
function fireShot(e,kind,ang){const s=SHOTS[kind];const ox=e.x+e.w/2+e.face*e.w*.35,oy=e.y+e.h*.4,tx=P.x+P.w/2,ty=P.y+P.h/2;let vx,vy;
  if(s.g>0){const t=.9;vx=(tx-ox)/t+(ang||0)*90;vy=(ty-oy-.5*s.g*t*t)/t}
  else{const a=Math.atan2(ty-oy,tx-ox)+(ang||0);vx=Math.cos(a)*s.sp;vy=Math.sin(a)*s.sp}
  L.shots.push({x:ox,y:oy,vx,vy,g:s.g,r:s.r,c:s.c,dmg:s.dmg,kind,glow:s.glow,hostile:true,life:4})}
function updEnemy(e,dt){
  if(e.x>cam.x+W+80||e.x+e.w<cam.x-160)return;
  e.t+=dt;e.flash-=dt;e.atk-=dt;e.cd-=dt;
  const dx=P.x+P.w/2-(e.x+e.w/2),adx=Math.abs(dx),sameLvl=Math.abs(P.y+P.h-(e.y+e.h))<44;
  if(e.kb>0){e.kb-=dt;if(e.fly){e.vx*=.9;e.vy*=.9}}
  else switch(e.ai){
    case 'walk':
      if(adx<170&&sameLvl)e.face=Math.sign(dx)||e.face;
      if(e.onGround&&!groundAhead(e))e.face*=-1;e.vx=e.face*e.sp;break;
    case 'charge':
      if(e.chT>0){e.chT-=dt;e.vx=e.face*e.sp*2.6;if(e.onGround&&!groundAhead(e)){e.chT=0;e.vx=0}}
      else if(adx<160&&sameLvl&&e.cd<=0){e.face=Math.sign(dx)||e.face;e.chT=.75;e.cd=2.2;e.atk=.3}
      else{if(e.onGround&&!groundAhead(e))e.face*=-1;e.vx=e.face*e.sp*.5}break;
    case 'hop':
      if(e.onGround){e.vx*=.8;if(e.cd<=0&&adx<230){e.face=Math.sign(dx)||1;e.vy=-R2(230,310);e.vx=e.face*e.sp*1.6;e.cd=R2(.8,1.6)}}break;
    case 'fly':

        if(adx<130&&e.cd<=0){const a=Math.atan2(P.y+P.h/2-(e.y+e.h/2),dx);e.vx=Math.cos(a)*e.sp*2.3;e.vy=Math.sin(a)*e.sp*2.3;e.sw=.9}}break;

      L.boss=null;L.portal={x:L.lock+W/2-12,y:L.ay-44,w:24,h:44,t:0};for(let i=0;i<14;i++)L.items.push({type:'coin',x:b.x+b.w/2,y:b.y+b.h/2,w:8,h:8,vx:R2(-150,150),vy:R2(-320,-160)})}return}
  const en=b.hp<b.maxhp/2,k=en?1.35:1,dx=P.x+P.w/2-(b.x+b.w/2);

      else if(b.sub===1){b.vx=b.face*270*k;b.stT-=dt;if(Math.random()<.5)burst(b.x+b.w/2-b.face*b.w/2,b.y+b.h-2,['#c8b8a8'],1,40,0);
        if(b.hitWall||b.stT<=0){b.sub=2;b.stT=.8;b.vx=-b.face*60;b.vy=-160;shake(6,.35);SFX.boom()}}

        for(const d of[-1,1])L.shots.push({x:b.x+b.w/2+d*b.w/2,y:b.y+b.h-6,vx:d*185,vy:0,g:0,r:6,c:'#c89a5a',dmg:2,kind:'shock',hostile:true,life:1.5,noSolid:1});

  else{b.vy=Math.min(b.vy+G*dt,600);moveEnt(b,dt)}

/* ---------- world update ---------- */
function updateWorld(dt){
  updPlayer(dt);if(state!=='play')return;
  for(const e of L.enemies)if(!e.dead)updEnemy(e,dt);
  L.enemies=L.enemies.filter(e=>!e.dead);
  if(L.boss)updBoss(L.boss,dt);
  for(const s of L.shots){s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.hostile){if(hitCR(s,P)&&P.inv<=0&&P.dashT<=0){hurtP(s.dmg,Math.sign(s.vx)||1);s.life=0}}
    else{for(const e of L.enemies)if(!e.dead&&!s.hits.has(e)&&hitCR(s,e)){s.hits.add(e);hitEnemy(e,s.dmg,s.face)}
      const b=L.boss;if(b&&!b.dying&&b.state!=='intro'&&!s.hits.has(b)&&hitCR(s,b)){s.hits.add(b);hitEnemy(b,s.dmg,s.face)}}
    if(!s.noSolid&&solidAt(s.x,s.y)){s.life=0;burst(s.x,s.y,[s.c||'#bfefff','#fff'],6,80)}
    if(s.x<cam.x-60||s.x>cam.x+W+60||s.y>H+20)s.life=0}
  L.shots=L.shots.filter(s=>s.life>0);
  for(const it of L.items){if(!it.st){it.vy=Math.min((it.vy||0)+G*dt,400);it.vx=(it.vx||0)*.98;moveEnt(it,dt);if(it.onGround)it.vx*=.8;it.age=(it.age||0)+dt}
    const near=Math.hypot(P.x+6-(it.x+4),P.y+11-(it.y+4));if(near<40&&(!it.st)&&it.age>.4){it.x+=(P.x+2-it.x)*dt*6;it.y+=(P.y+8-it.y)*dt*6}
    if(ov(it,P)&&(it.st||it.age>.25)){it.got=1;if(it.type==='coin'){score+=10;SFX.coin()}else{P.hp=Math.min(P.maxhp,P.hp+3);SFX.heal();popText(P.x+6,P.y-6,'+3','#7aff8a')}}}
  L.items=L.items.filter(i=>!i.got&&i.y<H+40);
  if(!L.started&&P.x>L.arenaX+60){L.started=true;L.lock=L.arenaX;L.boss=mkBoss();bannerT=0;L.warn=2;L.enemies=L.enemies.filter(e=>e.x>L.lock-20)}
  if(L.warn>0)L.warn-=dt;
  if(L.portal){L.portal.t+=dt;if(ov(L.portal,P)){state='clear';clearT=2.8;SFX.heal();
    if(L.si+1>unlocked&&L.si+1<STAGES.length){unlocked=L.si+1;store.set('botw_unlock',unlocked)}if(score>best){best=score;store.set('botw_best',best)}}}
  const tx=L.lock!=null?L.lock:Math.min(L.arenaX,Math.max(-40,P.x-W*.4));cam.x+=(tx-cam.x)*Math.min(1,dt*6);
  if(L.lock!=null&&P.x<L.lock)P.x=L.lock;
}

    else if(w==='snow'){q.x+=(-10+Math.sin(q.p)*8)*dt;q.y+=(22+q.s*25)*dt}
    else if(w==='sand'){q.x-=(150+q.s*120)*dt;q.y+=Math.sin(q.p*3)*10*dt}

/* ---------- loop ---------- */
function anyStart(){return pressed.P||pressed.T||pressed.A||pressed.J}
function titleBG(si){L=genLevel(si);P=newPlayer();cam.x=0;initWeather()}
function update(dt){time+=dt;if(shakeT>0)shakeT-=dt;else shakeA=0;
  if(state==='title'){cam.x+=30*dt;if(cam.x>L.arenaX)cam.x=0;
    if(pressed.L&&sel>0){sel--;titleBG(sel)}if(pressed.R&&sel<unlocked){sel++;titleBG(sel)}
    if(anyStart()){score=0;loadStage(sel)}updWeather(dt);return}
  if(state==='play'){if(pressed.P){state='pause';return}if(bannerT>0)bannerT-=dt;
    if(hitStop>0){hitStop-=dt;return}updateWorld(dt);updParts(dt)}
  else if(state==='pause'){if(pressed.P||pressed.T)state='play'}
  else if(state==='over'){overT+=dt;updParts(dt);if(overT>.9&&anyStart()){score=L.startScore;loadStage(L.si)}}
  else if(state==='clear'){clearT-=dt;updParts(dt);if(clearT<=0){if(L.si+1<STAGES.length)loadStage(L.si+1);else{state='win';if(score>best){best=score;store.set('botw_best',best)}}}}
  else if(state==='win'){if(anyStart()){state='title';sel=Math.min(unlocked,STAGES.length-1);titleBG(sel)}}
  updWeather(dt)}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();for(const k in pressed)pressed[k]=false;requestAnimationFrame(loop)}

/* ---------- sizing ---------- */
function resize(){const r=document.getElementById('wrap'),vw=r.clientWidth,vh=r.clientHeight,portrait=vh>vw;
  const s=Math.min(vw/W,(TOUCH&&portrait?vh*.6:vh)/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  r.style.justifyContent=TOUCH&&portrait?'flex-start':'center';r.style.paddingTop=TOUCH&&portrait?'56px':'0'}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause'});
sel=Math.min(unlocked,STAGES.length-1);titleBG(sel);requestAnimationFrame(loop);
</script>
</body>
